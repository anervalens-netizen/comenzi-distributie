http://app.example.invalid {
	encode zstd gzip
	request_header -CF-Connecting-IP
	header {
		X-Content-Type-Options "nosniff"
		Referrer-Policy "strict-origin-when-cross-origin"
		-Server
	}
	@pwa path /manifest.webmanifest /sw.js /offline.html /icons/*
	header @pwa Cache-Control "no-cache"
	header >Permissions-Policy "camera=(), microphone=(), geolocation=(self), web-share=(self)"
	header X-Frame-Options "DENY"
	reverse_proxy 127.0.0.1:39120 {
		header_up Host app.example.invalid
		header_up X-Forwarded-Host app.example.invalid
		header_up X-Forwarded-Proto https
		header_up CF-Connecting-IP {client_ip}
	}
}
