name: check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

jobs:
  check:
    runs-on: ${{ (github.event_name == 'pull_request' || vars.CI_EXECUTOR != 'gaming') && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","gaming-ci","comenzi-distributie"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Use tested npm
        run: npm install --global npm@12.0.2
      - name: Install
        run: npm ci
      - name: Verify browser
        run: |
          command -v google-chrome
          google-chrome --version
      - name: Full check
        run: npm run check
